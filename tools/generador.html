<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Qué hacemos hoy? — Panel Bastián</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream:          #f5f0e8;
  --cream-soft:     #fdfaf3;
  --paper:          #fbf6ec;
  --beige:          #ede4d3;
  --beige-deep:     #e3d6bd;
  --line:           #d8c9aa;
  --line-soft:      #e8dcc4;
  --terracota:      #c9956f;
  --terracota-deep: #b07a52;
  --ocre:           #b8864a;
  --ocre-soft:      #d4a861;
  --moss:           #7a8d5c;
  --rust:           #a4492c;
  --ink:            #2d2418;
  --ink-soft:       #5a4a37;
  --muted:          #8a7860;
  --muted-soft:     #a89880;
  --r-xs: 8px; --r-sm: 12px; --r-md: 14px; --r-lg: 20px; --r-btn: 11px;
  --shadow-xs: 0 1px 2px rgba(45,36,24,.05);
  --shadow-sm: 0 2px 10px rgba(45,36,24,.06);
  --shadow-md: 0 10px 30px rgba(45,36,24,.09);
  --f-ui:   'Geist', system-ui, sans-serif;
  --f-read: 'Geist', system-ui, sans-serif;
  --f-data: 'Geist Mono', monospace;
}

body {
  background:
    radial-gradient(ellipse 70% 45% at 85% -5%, rgba(201,149,111,.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at -5% 105%, rgba(184,134,74,.07) 0%, transparent 60%),
    var(--cream);
  color: var(--ink);
  font-family: var(--f-read);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding: 2rem 1rem 4rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}
::selection { background: var(--terracota); color: var(--cream-soft); }

.container {
  width: 100%;
  max-width: 760px;
}
.back { display:inline-block; font-family: var(--f-data); font-size: .68rem; color: var(--muted); text-decoration: none; text-transform: uppercase; letter-spacing: .12em; margin-bottom: 1rem; }
.back:hover { color: var(--terracota-deep); }

/* ── API SETUP ── */
.api-setup {
  background: var(--cream-soft);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  padding: 1rem 1.25rem;
  margin-bottom: 1.75rem;
  box-shadow: var(--shadow-xs);
}
.api-setup summary {
  font-family: var(--f-ui);
  font-size: .82rem;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 7px;
}
.api-setup summary::-webkit-details-marker { display: none; }
.api-icon {
  width: 24px; height: 24px;
  background: var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}
.api-body {
  margin-top: .85rem;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.api-note {
  font-size: .78rem;
  color: var(--muted);
  line-height: 1.5;
}
.api-note a { color: var(--ink-soft); }
.api-row { display: flex; gap: 7px; }
.api-input {
  flex: 1;
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--paper);
  color: var(--ink);
  font-size: .78rem;
  font-family: var(--f-data);
}
.api-input:focus { outline: none; border-color: var(--terracota); }
.btn-xs {
  padding: 7px 13px;
  border: 1px solid var(--line);
  border-radius: var(--r-btn);
  background: var(--cream-soft);
  color: var(--ink-soft);
  font-size: .78rem;
  font-family: var(--f-ui);
  cursor: pointer;
  white-space: nowrap;
  transition: border-color .15s, background .15s;
}
.btn-xs:hover { border-color: var(--terracota); background: var(--paper); }
.api-status {
  font-size: .72rem;
  font-family: var(--f-data);
  padding: 5px 9px;
  border-radius: var(--r-xs);
  display: none;
}
.api-status.ok  { background: rgba(122,141,92,.12); color: var(--moss); display: block; }
.api-status.err { background: rgba(164,73,44,.10);  color: var(--rust); display: block; }

/* ── HEADER ── */
.app-header { margin-bottom: 1.75rem; }
.eyebrow {
  font-family: var(--f-ui);
  font-size: .72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .16em;
  color: var(--muted);
  margin-bottom: 4px;
}
.app-title {
  font-family: var(--f-ui);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -.025em;
  line-height: 1.2;
  margin-bottom: 4px;
}
.app-sub {
  font-size: .85rem;
  color: var(--ink-soft);
  line-height: 1.45;
}

/* ── MODO TABS ── */
.mode-scroll {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 1.1rem;
}

.mode-btn {
  flex-shrink: 0;
  padding: 7px 15px;
  border-radius: 20px;
  border: 1px solid var(--line-soft);
  background: var(--cream-soft);
  font-family: var(--f-ui);
  font-size: .82rem;
  font-weight: 400;
  cursor: pointer;
  color: var(--muted);
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.mode-btn:hover { border-color: var(--terracota); color: var(--ink-soft); background: var(--paper); }
.mode-btn.active {
  background: var(--ink);
  color: var(--cream-soft);
  border-color: var(--ink);
  font-weight: 500;
}

/* ── FILTROS ── */
.filter-wrap { margin-bottom: 1rem; }
.filter-label {
  font-family: var(--f-ui);
  font-size: .72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .16em;
  color: var(--muted);
  margin-bottom: 7px;
}
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--line-soft);
  background: transparent;
  font-family: var(--f-ui);
  font-size: .78rem;
  cursor: pointer;
  color: var(--muted);
  transition: all .12s;
}
.chip:hover { border-color: var(--terracota); color: var(--ink-soft); background: var(--paper); }
.chip.active {
  background: var(--cream-soft);
  border-color: var(--line);
  color: var(--ink-soft);
  font-weight: 500;
}

/* ── BOTÓN TIRAR ── */
.spin-btn {
  width: 100%;
  padding: 13px;
  border-radius: var(--r-btn);
  border: none;
  background: var(--ink);
  color: var(--cream-soft);
  font-family: var(--f-ui);
  font-size: .95rem;
  font-weight: 500;
  cursor: pointer;
  margin: 1rem 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: background .15s, transform .1s;
  letter-spacing: -.01em;
}
.spin-btn:hover { background: var(--terracota-deep); }
.spin-btn:active { transform: scale(0.985); }
.spin-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.spin-icon { font-size: 17px; display: inline-block; }
.spin-icon.spinning { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── STATUS ── */
.status {
  text-align: center;
  font-size: .82rem;
  color: var(--muted);
  padding: 1rem;
  display: none;
  font-family: var(--f-data);
}
.status.visible { display: block; }

/* ── RESULT CARD ── */
.result-card {
  background: var(--cream-soft);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  padding: 1.25rem;
  display: none;
  box-shadow: var(--shadow-sm);
  animation: secIn .22s ease;
  position: relative;
  overflow: hidden;
}
.result-card::after {
  content: '';
  position: absolute;
  bottom: -20px; right: -20px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: var(--terracota);
  opacity: .04;
  filter: blur(32px);
  pointer-events: none;
}
.result-card.visible { display: block; }
/* ── Detalle completo: todas las columnas de la fila ── */
.res-fields { text-align:left; margin-top:14px; border-top:1px solid var(--line-soft); padding-top:12px; }
.rf-title { font-size:.70rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; }
.rf-row { display:flex; gap:12px; padding:5px 0; border-bottom:1px solid var(--line-soft); font-size:.82rem; }
.rf-row:last-child { border-bottom:none; }
.rf-key { min-width:120px; max-width:140px; flex-shrink:0; color:var(--muted); font-weight:600; }
.rf-val { flex:1; color:var(--ink); word-break:break-word; white-space:pre-wrap; }

@keyframes secIn { from { transform: translateY(8px); } to { transform: translateY(0); } }

.res-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--f-data);
  font-size: .6rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .1em;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid var(--line-soft);
  background: var(--paper);
  color: var(--muted);
  margin-bottom: 10px;
}

.res-name {
  font-family: var(--f-ui);
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
  letter-spacing: -.02em;
  line-height: 1.25;
}

.res-meta {
  font-size: .85rem;
  color: var(--ink-soft);
  line-height: 1.5;
  margin-bottom: 8px;
}

.res-nota {
  font-size: .82rem;
  color: var(--ink-soft);
  background: var(--paper);
  border-radius: var(--r-sm);
  padding: 9px 13px;
  margin-bottom: 12px;
  border-left: 2px solid var(--terracota);
  line-height: 1.5;
  display: none;
}

.res-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: .78rem;
  color: var(--ink-soft);
  text-decoration: none;
  margin-bottom: 12px;
  padding: 5px 11px;
  border: 1px solid var(--line-soft);
  border-radius: 20px;
  transition: border-color .12s, background .12s;
  font-family: var(--f-ui);
}
.res-link:hover { border-color: var(--terracota); background: var(--paper); }

.res-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  padding-top: 11px;
  border-top: 1px solid var(--line-soft);
  margin-top: 4px;
}

.btn-ghost {
  padding: 6px 13px;
  border-radius: var(--r-btn);
  border: 1px solid var(--line-soft);
  background: var(--cream-soft);
  color: var(--ink-soft);
  font-family: var(--f-ui);
  font-size: .78rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: border-color .12s, background .12s;
}
.btn-ghost:hover { border-color: var(--terracota); background: var(--paper); }

/* Línea de info bajo el botón */
.info-line {
  text-align: center;
  font-family: var(--f-data);
  font-size: .7rem;
  color: var(--muted);
  margin: .6rem 0 0;
  line-height: 1.7;
}
.info-line .warn { color: var(--rust); }
.linkish {
  background: none; border: 0; padding: 0;
  font: inherit; color: var(--terracota-deep);
  text-decoration: underline; cursor: pointer;
}

/* Historial de la sesión */
.historial { margin-top: 1rem; }
.hist-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--f-data); font-size: .66rem; text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); margin-bottom: .45rem;
}
.hist-head .linkish { text-transform: none; letter-spacing: 0; }
.hist-row {
  display: flex; gap: 10px; align-items: baseline; width: 100%;
  text-align: left; padding: 8px 11px; margin-bottom: 5px;
  background: var(--cream-soft); border: 1px solid var(--line-soft);
  border-radius: var(--r-sm); cursor: pointer; font-family: var(--f-ui);
  transition: border-color .12s, background .12s;
}
.hist-row:hover { border-color: var(--terracota); background: var(--paper); }
.hist-row.actual { border-color: var(--terracota); }
.hist-cat  { flex: 0 0 auto; font-family: var(--f-data); font-size: .64rem; color: var(--muted); white-space: nowrap; }
.hist-name { flex: 1 1 auto; font-size: .84rem; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }

/* Botón Asignar → handoff al Planificador */
.btn-assign {
  padding: 6px 13px;
  border-radius: var(--r-btn);
  border: 1px solid var(--terracota);
  background: transparent;
  color: var(--terracota-deep);
  font-family: var(--f-ui);
  font-size: .78rem;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all .15s;
}
.btn-assign:hover { background: var(--terracota); color: var(--cream-soft); }

/* ── ERROR ── */
.error-box {
  background: rgba(164,73,44,.08);
  color: var(--rust);
  border: 1px solid rgba(164,73,44,.2);
  border-radius: var(--r-sm);
  padding: 11px 14px;
  font-size: .82rem;
  line-height: 1.5;
  display: none;
  margin-top: 1rem;
}
.error-box.visible { display: block; }

/* ── FOOTER ── */
.footer {
  margin-top: 2.5rem;
  text-align: center;
  font-family: var(--f-data);
  font-size: .65rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--muted-soft);
  line-height: 1.8;
}

@media (max-width: 480px) {
  body { padding: 1.25rem .75rem 3rem; }
  .app-title { font-size: 1.25rem; }
}
</style>
</head>
<body>

<div class="container">

  <a class="back" href="../index.html">← Panel</a>

  <!-- HEADER -->
  <div class="app-header">
    <div class="eyebrow">Generador · Panel Bastián</div>
    <div class="app-title">¿Qué hacemos hoy?</div>
    <div class="app-sub">Selecciona una categoría y te sugiero algo al azar desde tu Notion</div>
  </div>

  <!-- MODOS -->
  <div class="mode-scroll" id="modeTabs">
    <button class="mode-btn active" data-mode="lugares"  onclick="setMode('lugares')">📍 Lugares</button>
    <button class="mode-btn"        data-mode="comida"   onclick="setMode('comida')">🍳 Comida</button>
    <button class="mode-btn"        data-mode="ocio"     onclick="setMode('ocio')">🎮 Ocio</button>
    <button class="mode-btn"        data-mode="mias"     onclick="setMode('mias')">💡 Ideas mías</button>
    <button class="mode-btn"        data-mode="melin"    onclick="setMode('melin')">👶 Guagua Melín-Zayd</button>
  </div>

  <!-- FILTROS -->
  <div class="filter-wrap" id="filterWrap"></div>

  <!-- BOTÓN -->
  <button class="spin-btn" id="spinBtn" onclick="tirar()">
    <span class="spin-icon" id="spinIcon">🎲</span>
    Tirar al azar
  </button>

  <!-- INFO: tamaño de la lista, descartados, actualizar -->
  <div class="info-line" id="infoLine" style="display:none"></div>

  <!-- STATUS -->
  <div class="status" id="statusMsg"></div>

  <!-- ERROR -->
  <div class="error-box" id="errorBox"></div>

  <!-- RESULTADO -->
  <div class="result-card" id="resultCard">
    <div class="res-badge" id="resBadge"></div>
    <div class="res-name"  id="resName"></div>
    <div class="res-meta"  id="resMeta"></div>
    <div class="res-nota"  id="resNota"></div>
    <div id="resLink"></div>
    <div class="res-fields" id="resAllFields" style="display:none"></div>
    <div class="res-actions">
      <button class="btn-ghost"  onclick="tirar()">🔀 Otro</button>
      <button class="btn-ghost"  onclick="marcarVisto()" title="No volverá a salir en este navegador">👁 Ya lo vi</button>
      <button class="btn-ghost"  id="notionBtn" style="display:none">📋 Ver en Notion</button>
      <!-- HANDOFF → Planificador (panel.v5.pendingActivities) -->
      <button class="btn-assign" id="assignBtn" onclick="prepareHandoff()" style="display:none">📅 Asignar a momento</button>
    </div>
  </div>

  <!-- HISTORIAL DE LA SESIÓN -->
  <div class="historial" id="historial" style="display:none"></div>

  <div class="footer">
    Panel Bastián · Generador v2.1 · Notion vía proxy · sin IA
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  GENERADOR v2.1 — sortea UNA cosa desde tus bases de Notion.
//  No usa IA: lee Notion vía proxy (Vercel) y sortea en el navegador.
//
//  Cómo sortea:
//   1. Categoría elegida → usa esa. "Todo" → sortea una categoría
//      ponderada por su tamaño (= cada ítem de la base igual de probable).
//   2. Pide a Notion SOLO esa categoría (filtro del lado del servidor).
//   3. Guarda la lista 6 h en este navegador → próximas tiradas instantáneas.
//   4. Azar puro: puede repetir, como un dado.
//   5. "Ya lo vi" lo saca para siempre de los sorteos (solo en este navegador).
//   6. Lo que va saliendo queda listado abajo mientras la pestaña siga abierta.
// ═══════════════════════════════════════════════════════════════

// ── FUENTES ──
// options = categoría → cantidad aprox. de ítems (Notion, 14-10-2026).
// La cantidad solo pondera "Todo" y se corrige sola cada vez que se
// descarga una lista. Una categoría nueva en Notion se agrega aquí.
const MODES = {
  lugares: {
    label: 'Lugar', emoji: '📍',
    sources: { main: {
      collection: 'collection://3359a86b-a8ec-8058-9b3d-000bbb083025',
      nameField: 'Nombre', notaField: 'Nota', linkField: 'Link',
      options: { 'Comida':329, 'Comida Region':66, 'Delivery o Retiro':29, 'Extranjero':442, 'Paseo':97,
                 'Naturaleza':145, 'Weas Baratas':61, 'Tips para Viajar':64, 'Tips para acampar':23 },
    }},
    ratingField: 'Select',
    ratingMap: { 'WenoWeno':'⭐ WenoWeno', 'Ahi nomas':'✓ Ahí nomás', 'Malo':'✗ Malo' },
  },
  comida: {
    label: 'Comida', emoji: '🍳',
    sources: {
      ideas: {
        collection: 'collection://3509a86b-a8ec-8025-9111-000b8bb658ee',
        nameField: 'Nombre', notaField: 'Nota', linkField: 'Link',
        options: { 'Ideas sin receta':618, 'Especificos':65, 'Como comprar xd':57, 'como comer Tutorial':18, 'Como almacenar':58 },
      },
      recetas: {
        collection: 'collection://34c9a86b-a8ec-8090-907f-000b9cdf1fbb',
        nameField: 'Name', notaField: null, linkField: 'Link',
        options: { 'Salado':459, 'Dulce':67, 'Cocktail':55 },
      },
    },
  },
  ocio: {
    label: 'Ocio', emoji: '🎮',
    sources: { main: {
      collection: 'collection://3519a86b-a8ec-80bf-be17-000b0584b979',
      nameField: 'Nombre', notaField: 'Gracia', linkField: 'Link',
      options: { 'Peliculas':1350, 'Musica':512, 'Serie':266, 'Anime':176, 'Cortos':59, 'Manga':185, 'Libros':282,
                 'Libros Practicos':15, 'Juegos':2970, 'Juego Mesa':123, 'Juegos con melin':86, 'otros juegos':194,
                 'Emulacion':9, 'Dinamicas y otros':94 },
    }},
    ratingField: 'Veredicto',
    ratingMap: { 'Wena':'⭐ Wena', 'Mala':'✗ Mala' },
  },
  mias: {
    label: 'Idea mía', emoji: '💡',
    sources: { main: {
      collection: 'collection://3419a86b-a8ec-80dd-897d-000b244fccee',
      nameField: 'Nombre', notaField: 'Nota', linkField: 'Link',
      options: { 'Ideas Sueltas xd':381, 'Aprender otros':283, 'Invertir':210, 'Ejercicio':151,
                 'Aprender Farma':129, 'Comprar':93, 'Laborales':7 },
    }},
  },
  melin: {
    label: 'Guagua Melín-Zayd', emoji: '👶',
    sources: { main: {
      collection: 'collection://33e9a86b-a8ec-80d8-8800-000b9a7e5a4d',
      nameField: 'Nombre', notaField: 'Texto', linkField: 'Link',
      options: { 'Cosas que se hacen':280, 'Cosas a tener en mente':264, 'Cosas que se compran':167,
                 'Cosas para ver':115, 'Cosas para aprender':21, 'Eventos':18 },
    }},
  },
};

// Categorías que NO entran al sorteo de "Todo" (siguen disponibles con su chip).
// Ej: ['Tips para Viajar','Tips para acampar'] si no quieres tips como "plan".
const FUERA_DE_TODO = [];

// ── AJUSTES ──
const NOTION_API     = 'https://analizador-de-acciones.vercel.app';
const CACHE_TTL_MS   = 6 * 60 * 60 * 1000;    // listas guardadas 6 h
const MAX_LISTAS_LS  = 4;                     // máx. listas guardadas a la vez
const MAX_HISTORIAL  = 50;                    // ítems listados por sesión
const LS             = 'gen.v2';              // prefijo propio (no choca con panel.v5)

// ── ESTADO ──
let currentMode = 'lugares';
let selected    = null;        // { src, cat } o null = Todo
let isLoading   = false;
let lastItem    = null;        // ítem en pantalla (para handoff / ya lo vi)
let lastList    = null;        // { src, cat, total, parcial }
const memoria   = new Map();   // listas ya descargadas en esta sesión

window.addEventListener('DOMContentLoaded', () => { renderFilters(); renderInfo(); renderHistorial(); });

// ═══════════════════════════════════════════
//  AZAR — entero uniforme en [0, n)
//  crypto.getRandomValues + rechazo = sin sesgo de módulo.
// ═══════════════════════════════════════════
function azar(n) {
  if (n <= 1) return 0;
  if (!window.crypto?.getRandomValues) return Math.floor(Math.random() * n);
  const lim = Math.floor(0x100000000 / n) * n;
  const b = new Uint32Array(1);
  do { crypto.getRandomValues(b); } while (b[0] >= lim);
  return b[0] % n;
}

// Elige uno de `opciones` con probabilidad proporcional a `peso(op)`
function azarPonderado(opciones, peso) {
  const pesos = opciones.map(o => Math.max(1, Math.round(peso(o)) || 1));
  let r = azar(pesos.reduce((a, b) => a + b, 0));
  for (let i = 0; i < opciones.length; i++) { if (r < pesos[i]) return opciones[i]; r -= pesos[i]; }
  return opciones[opciones.length - 1];
}

// Sin tildes / mayúsculas / espacios: "Películas" == "peliculas "
function norm(s) { return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase(); }

// Id corto y estable de una fila (para "ya lo vi")
function idDe(item, nameField) { return String(item?.url || item?.[nameField] || '').slice(-16); }

// ── Almacenamiento seguro (puede fallar en modo privado o por cuota) ──
function lsGet(k, def, st = localStorage) { try { const v = st.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function lsSet(k, v, st = localStorage)   { try { st.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
function lsDel(k, st = localStorage)      { try { st.removeItem(k); } catch {} }
const SS = (() => { try { return window.sessionStorage; } catch { return undefined; } })();

// ═══════════════════════════════════════════
//  MODO Y FILTROS
// ═══════════════════════════════════════════
function setMode(mode) {
  currentMode = mode; selected = null;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  renderFilters(); hideResult(); hideError(); hideStatus();
  lastList = null; renderInfo(); renderHistorial();
}

function chipsDe(m) {
  const out = [];
  for (const [src, cfg] of Object.entries(m.sources))
    for (const cat of Object.keys(cfg.options)) out.push({ src, cat });
  return out;
}

function renderFilters() {
  const m = MODES[currentMode];
  let html = `<div class="filter-label">Filtrar por categoría</div><div class="chips">`;
  html += `<button class="chip active" data-i="-1">Todo</button>`;
  chipsDe(m).forEach((c, i) => html += `<button class="chip" data-i="${i}">${escHtml(c.cat)}</button>`);
  html += `</div>`;
  const wrap = document.getElementById('filterWrap');
  wrap.innerHTML = html;
  wrap.querySelectorAll('.chip').forEach(el => el.onclick = () => {
    wrap.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    const i = Number(el.dataset.i);
    selected = i < 0 ? null : chipsDe(MODES[currentMode])[i];
  });
}

// Tamaño conocido de una categoría: el último medido, o el de la tabla de arriba
function tamano(modeKey, c) {
  const cfg = MODES[modeKey].sources[c.src];
  const medidos = lsGet(`${LS}.conteos`, {});
  return medidos[`${cfg.collection}|${c.cat}`] ?? cfg.options[c.cat] ?? 1;
}

// ═══════════════════════════════════════════
//  OBTENER LISTA (memoria → navegador → Notion)
// ═══════════════════════════════════════════
async function obtenerLista(src, cat, { forzar = false } = {}) {
  const cfg = MODES[currentMode].sources[src];
  const key = `${cfg.collection}|${cat}`;

  if (!forzar) {
    if (memoria.has(key) && Date.now() - memoria.get(key).t < CACHE_TTL_MS) return memoria.get(key);
    const g = lsGet(`${LS}.lista.${key}`, null);
    if (g && Date.now() - g.t < CACHE_TTL_MS && Array.isArray(g.items)) {
      const lista = { key, t: g.t, items: g.items, parcial: false };
      memoria.set(key, lista); return lista;
    }
  }

  showStatus(`Consultando Notion: ${escHtml(cat)}…`);
  const qs = new URLSearchParams({ ds: cfg.collection, cat });
  if (forzar) qs.set('fresh', '1');
  const r = await fetch(`${NOTION_API}/api/notion?${qs}`);
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(r.status === 504
      ? 'Notion tardó demasiado (504). Intenta de nuevo en un momento.'
      : `Notion ${r.status}: ${e?.error || r.statusText}`);
  }
  const data = await r.json();

  // Limpieza: sin nombre fuera; categoría verificada también aquí
  // (por si el proxy es antiguo y no filtró del lado de Notion).
  const c = norm(cat);
  const items = (data.items || [])
    .filter(it => String(it?.[cfg.nameField] ?? '').trim())
    .filter(it => String(it?.Categoria ?? '').split(',').map(norm).includes(c))
    .map(compactar);

  const lista = { key, t: Date.now(), items, parcial: !!data.parcial };
  memoria.set(key, lista);
  if (!lista.parcial) {                         // una lista incompleta NO se guarda
    guardarLista(key, items);
    const medidos = lsGet(`${LS}.conteos`, {});  // tamaño real → mejora la ponderación de "Todo"
    medidos[key] = items.length; lsSet(`${LS}.conteos`, medidos);
  }
  return lista;
}

// Quita campos vacíos para que la lista ocupe poco en el navegador
function compactar(it) {
  const o = {};
  for (const [k, v] of Object.entries(it)) if (v !== null && v !== '' && v !== false) o[k] = v;
  return o;
}

// Guarda la lista; si no cabe, borra las más viejas y reintenta
function guardarLista(key, items) {
  const idxKey = `${LS}.indice`;
  let idx = lsGet(idxKey, []).filter(k => k !== key);
  idx.push(key);
  while (idx.length > MAX_LISTAS_LS) lsDel(`${LS}.lista.${idx.shift()}`);
  let ok = lsSet(`${LS}.lista.${key}`, { t: Date.now(), items });
  while (!ok && idx.length > 1) { lsDel(`${LS}.lista.${idx.shift()}`); ok = lsSet(`${LS}.lista.${key}`, { t: Date.now(), items }); }
  if (!ok) idx = idx.filter(k => k !== key);   // no cupo: queda solo en memoria
  lsSet(idxKey, idx);
}

// ═══════════════════════════════════════════
//  TIRAR AL AZAR
// ═══════════════════════════════════════════
async function tirar() {
  if (isLoading) return;
  const m = MODES[currentMode];
  isLoading = true; hideResult(); hideError(); setSpinning(true);

  try {
    // 1. Categoría: la elegida, o una ponderada por tamaño si es "Todo"
    let elec = selected;
    if (!elec) {
      const pool = chipsDe(m).filter(c => !FUERA_DE_TODO.includes(c.cat));
      elec = azarPonderado(pool, c => tamano(currentMode, c));
    }
    const cfg = m.sources[elec.src];

    // 2. Lista de esa categoría
    const lista = await obtenerLista(elec.src, elec.cat);
    lastList = { src: elec.src, cat: elec.cat, total: lista.items.length, parcial: lista.parcial };

    // 3. Quitar solo lo marcado "Ya lo vi"
    const vistos = new Set(lsGet(`${LS}.vistos.${cfg.collection}`, []));
    const pool = lista.items.filter(it => !vistos.has(idDe(it, cfg.nameField)));
    if (!pool.length) {
      renderInfo();
      showStatus(lista.items.length
        ? `Ya marcaste todo "${escHtml(elec.cat)}" como visto.`
        : `"${escHtml(elec.cat)}" está vacía en Notion.`);
      return;
    }

    // 4. Sorteo puro (puede repetir)
    const item = pool[azar(pool.length)];
    hideStatus();
    mostrar(item, currentMode, elec.src);
    agregarHistorial(item, currentMode, elec.src);
    renderInfo();

  } catch (err) {
    hideStatus();
    showError(err.message || 'Error. Abre la consola (F12) para más detalle.');
    console.error('[Generador]', err);
  } finally {
    isLoading = false; setSpinning(false);
  }
}

// Muestra un ítem y lo deja como "actual" (handoff, ya lo vi)
function mostrar(item, modeKey, src) {
  const cfg = MODES[modeKey].sources[src];
  lastItem = { ...item, _mode: modeKey, _nameField: cfg.nameField, _src: src };
  showResult(item, modeKey, cfg);
}

// ═══════════════════════════════════════════
//  HISTORIAL DE LA SESIÓN (sessionStorage: muere al cerrar la pestaña)
// ═══════════════════════════════════════════
function agregarHistorial(item, modeKey, src) {
  const h = lsGet(`${LS}.historial`, [], SS);
  h.unshift({ item, mode: modeKey, src });
  if (h.length > MAX_HISTORIAL) h.length = MAX_HISTORIAL;
  lsSet(`${LS}.historial`, h, SS);
  renderHistorial();
}

function renderHistorial() {
  const el = document.getElementById('historial');
  if (!el) return;
  const h = lsGet(`${LS}.historial`, [], SS);
  if (!h.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const actual = lastItem ? idDe(lastItem, lastItem._nameField) : null;
  const filas = h.map((e, i) => {
    const m = MODES[e.mode], cfg = m?.sources[e.src];
    if (!cfg) return '';
    const nombre = e.item?.[cfg.nameField] || 'Sin nombre';
    const esActual = i === 0 && idDe(e.item, cfg.nameField) === actual;
    return `<button class="hist-row${esActual ? ' actual' : ''}" data-i="${i}">
      <span class="hist-cat">${m.emoji} ${escHtml(e.item?.Categoria || m.label)}</span>
      <span class="hist-name">${escHtml(nombre)}</span></button>`;
  }).join('');
  el.innerHTML = `<div class="hist-head"><span>Salieron en esta sesión (${h.length})</span>
    <button class="linkish" onclick="limpiarHistorial()">limpiar</button></div>${filas}`;
  el.querySelectorAll('.hist-row').forEach(b => b.onclick = () => {
    const e = lsGet(`${LS}.historial`, [], SS)[Number(b.dataset.i)];
    if (!e) return;
    hideStatus(); hideError();
    mostrar(e.item, e.mode, e.src);
    el.querySelectorAll('.hist-row').forEach(x => x.classList.toggle('actual', x === b));
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  el.style.display = 'block';
}

function limpiarHistorial() { lsDel(`${LS}.historial`, SS); renderHistorial(); }

// ═══════════════════════════════════════════
//  "YA LO VI" — fuera de los sorteos (en este navegador)
// ═══════════════════════════════════════════
function marcarVisto() {
  if (!lastItem) return;
  const cfg = MODES[lastItem._mode].sources[lastItem._src];
  const k = `${LS}.vistos.${cfg.collection}`;
  const v = new Set(lsGet(k, []));
  v.add(idDe(lastItem, cfg.nameField));
  lsSet(k, [...v]);
  renderInfo();
  tirar();                       // y pasa directo a otro
}

function restablecerVistos() {
  for (const cfg of Object.values(MODES[currentMode].sources)) lsDel(`${LS}.vistos.${cfg.collection}`);
  renderInfo();
}

async function actualizarLista() {
  if (!lastList || isLoading) return;
  isLoading = true; setSpinning(true); hideError();
  try {
    const l = await obtenerLista(lastList.src, lastList.cat, { forzar: true });
    lastList.total = l.items.length; lastList.parcial = l.parcial;
    hideStatus(); renderInfo();
  } catch (err) { hideStatus(); showError(err.message); }
  finally { isLoading = false; setSpinning(false); }
}

// Línea de información bajo el botón: tamaño de la lista y descartados
function renderInfo() {
  const el = document.getElementById('infoLine');
  if (!el) return;
  const nVistos = Object.values(MODES[currentMode].sources)
    .reduce((a, cfg) => a + lsGet(`${LS}.vistos.${cfg.collection}`, []).length, 0);
  const partes = [];
  if (lastList) {
    partes.push(`${escHtml(lastList.cat)}: ${lastList.total.toLocaleString('es-CL')} en la lista`);
    if (lastList.parcial) partes.push(`<span class="warn">⚠ lista incompleta (Notion tardó)</span>`);
    partes.push(`<button class="linkish" onclick="actualizarLista()">↻ actualizar</button>`);
  }
  if (nVistos) partes.push(`${nVistos} descartado${nVistos > 1 ? 's' : ''} · <button class="linkish" onclick="restablecerVistos()">restablecer</button>`);
  el.innerHTML = partes.join(' · ');
  el.style.display = partes.length ? 'block' : 'none';
}

// ═══════════════════════════════════════════
//  MOSTRAR RESULTADO
// ═══════════════════════════════════════════
function showResult(item, modeKey, cfg) {
  const m = MODES[modeKey];
  const nombre    = item?.[cfg.nameField] || 'Sin nombre';
  const categoria = item?.Categoria || '';
  const nota      = cfg.notaField ? (item?.[cfg.notaField] || null) : null;
  const link      = cfg.linkField ? (item?.[cfg.linkField] || null) : null;
  const notionUrl = item?.url || null;

  document.getElementById('resBadge').textContent = `${m.emoji} ${categoria || m.label}`;
  document.getElementById('resName').textContent  = nombre;

  let meta = '';
  if (modeKey === 'lugares') {
    if (item?.Comuna)      meta += item.Comuna;
    if (item?.Horario)     meta += (meta ? ' · ' : '') + item.Horario;
    if (item?.Descripcion) meta += (meta ? '\n' : '') + item.Descripcion;
  } else if (modeKey === 'ocio') {
    if (item?.Plataforma1) meta += item.Plataforma1;
  } else if (modeKey === 'comida') {
    if (item?.RRSS) meta += item.RRSS;
  }
  if (m.ratingField && item?.[m.ratingField] && m.ratingMap)
    meta += (meta ? ' · ' : '') + (m.ratingMap[item[m.ratingField]] || item[m.ratingField]);
  const metaEl = document.getElementById('resMeta');
  metaEl.textContent   = meta;
  metaEl.style.display = meta ? 'block' : 'none';

  const notaEl = document.getElementById('resNota');
  if (String(nota ?? '').trim()) { notaEl.textContent = nota; notaEl.style.display = 'block'; }
  else { notaEl.style.display = 'none'; }

  document.getElementById('resLink').innerHTML = link
    ? `<a href="${escAttr(link)}" target="_blank" rel="noopener" class="res-link">🔗 Ver referencia</a>` : '';

  const notionBtn = document.getElementById('notionBtn');
  if (notionUrl) { notionBtn.style.display = 'flex'; notionBtn.onclick = () => window.open(notionUrl, '_blank'); }
  else { notionBtn.style.display = 'none'; }

  // Todas las columnas de la fila (para no tener que abrir Notion)
  const skip = new Set([cfg.nameField, 'url', 'id']);
  const rows = Object.entries(item)
    .filter(([k, v]) => !k.startsWith('_') && !skip.has(k) && v != null && String(v).trim() !== '')
    .map(([k, v]) => `<div class="rf-row"><span class="rf-key">${escHtml(k)}</span><span class="rf-val">${fmtVal(v)}</span></div>`)
    .join('');
  const allEl = document.getElementById('resAllFields');
  allEl.innerHTML = rows ? `<div class="rf-title">Todos los campos</div>${rows}` : '';
  allEl.style.display = rows ? 'block' : 'none';

  document.getElementById('assignBtn').style.display = 'flex';
  document.getElementById('resultCard').classList.add('visible');
}

// ═══════════════════════════════════════════
//  HANDOFF → Planificador de Salidas
//  Agrega el ítem a localStorage['panel.v5.pendingActivities'] (cola, máx 8);
//  el Planificador la lee al abrir su Modo 2.
// ═══════════════════════════════════════════
function prepareHandoff() {
  if (!lastItem) return;
  const item = {
    nombre:     lastItem[lastItem._nameField] || 'Sin nombre',
    categoria:  lastItem.Categoria || '',
    modo:       lastItem._mode,
    notionUrl:  lastItem.url || null,
    link:       lastItem.Link || null,
    timestamp:  new Date().toISOString()
  };
  let list = lsGet('panel.v5.pendingActivities', []);
  if (!Array.isArray(list)) list = [];
  if (!list.some(x => x.nombre === item.nombre)) list.push(item);   // sin duplicar por nombre
  if (list.length > 8) list = list.slice(-8);                        // tope de 8
  lsSet('panel.v5.pendingActivities', list);

  const btn = document.getElementById('assignBtn');
  const orig = btn.textContent;
  btn.textContent = `✓ Agregada (${list.length}) — abre el Planificador`;
  btn.style.background = 'var(--moss)';
  btn.style.color = 'var(--cream-soft)';
  btn.style.borderColor = 'var(--moss)';
  setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.style.borderColor = ''; }, 2500);
}

// ═══════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════
function setSpinning(on) {
  const icon = document.getElementById('spinIcon');
  const btn  = document.getElementById('spinBtn');
  icon.classList.toggle('spinning', on);
  btn.disabled = on;
  icon.textContent = on ? '⟳' : '🎲';
}
function showStatus(msg) { const el = document.getElementById('statusMsg'); el.innerHTML = msg; el.classList.add('visible'); }
function hideStatus()    { document.getElementById('statusMsg').classList.remove('visible'); }
function hideResult()    { document.getElementById('resultCard').classList.remove('visible'); }
function showError(msg)  { const el = document.getElementById('errorBox'); el.textContent = '⚠ ' + msg; el.classList.add('visible'); }
function hideError()     { document.getElementById('errorBox').classList.remove('visible'); }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return escHtml(s).replace(/"/g,'&quot;'); }
function fmtVal(v) {
  const raw = Array.isArray(v) ? v.join(', ') : (typeof v === 'object' ? JSON.stringify(v) : String(v));
  return escHtml(raw).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--terracota)">$1</a>');
}
</script>
